<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bloom & Note — Bouquet Builder</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;600;700&family=Quicksand:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>

<body>

<div class="title">
  <h1>Bloom &amp; Note</h1>
  <p>build a bouquet, tuck in a little letter</p>
</div>

<div class="container">

  <div class="controls">

    <div class="panel-label">🌿 pick your blooms</div>
    <div class="flower-grid" id="flowerGrid"></div>

    <div class="panel-label">🎀 background style</div>
    <div class="wrap-row" id="wrapRow"></div>

    <div class="panel-label">🎨 wrapper color</div>
    <div class="color-row" id="colorRow"></div>

    <div class="active-flower-panel" id="activeFlowerPanel">
      <div class="panel-label" style="font-size:18px; margin:0 0 6px 0; border:none;">✨ adjust selected bloom</div>
      <div class="control-row">
        <span>Rotate</span>
        <input type="range" id="sideRot" min="-180" max="180" value="0">
      </div>
      <div class="control-row">
        <span>Size</span>
        <input type="range" id="sideScale" min="0.6" max="1.6" step="0.05" value="1">
      </div>
    </div>

    <div class="panel-label">✉️ your note</div>
    <textarea id="letterInput" placeholder="Write something kind..." maxlength="240"></textarea>
    <input class="sign-input" id="signInput" placeholder="Sign it (optional)" maxlength="30">

    <button class="action-btn" id="saveBtn">Save as keepsake</button>
    <button class="action-btn ghost" id="clearBtn">Clear bouquet</button>

    <p class="hint">Click a flower to adjust. Drag to move. Press ✕ to delete.</p>

  </div>

  <div class="stage-outer">
    <div id="stage">
      <span class="tape left"></span>
      <span class="tape right"></span>

      <!-- Bouquet Wrapper Graphics Layer -->
      <div id="bouquetWrapper">
        <svg viewBox="0 0 320 240" xmlns="http://www.w3.org/2000/svg">
          <defs>
            <filter id="wrapperShadow" x="-20%" y="-20%" width="140%" height="140%">
              <feDropShadow dx="0" dy="4" stdDeviation="3" flood-color="#23211f" flood-opacity="0.14"/>
            </filter>
          </defs>

          <path d="M92,54 C112,36 136,24 160,24 C184,24 208,36 228,54 L258,102 C266,114 260,132 248,138 C228,148 202,160 172,168 C166,170 162,170 160,170 C158,170 154,170 148,168 C118,160 92,148 72,138 C60,132 54,114 62,102 Z"
                fill="currentColor" stroke="#23211f" stroke-width="2.4" opacity="0.34"/>

          <path id="wrapperShape" d="M88,56 C108,38 132,28 160,28 C188,28 212,38 232,56 L262,102 C270,114 264,130 252,136 C232,146 206,158 176,166 C168,168 164,168 160,168 C156,168 152,168 144,166 C114,158 88,146 68,136 C56,130 50,114 58,102 Z"
                fill="#ffea85" stroke="#23211f" stroke-width="3" filter="url(#wrapperShadow)"/>

          <path d="M108,76 C124,66 138,62 160,64 C182,62 196,66 212,76" stroke="#fff7d8" stroke-width="3" stroke-linecap="round" opacity="0.9"/>
          <path d="M110,96 C126,88 142,84 160,86 C178,84 194,88 210,96" stroke="#fff0b8" stroke-width="2" stroke-linecap="round" opacity="0.8"/>
          <path d="M116,122 C132,114 146,110 160,112 C174,110 188,114 204,122" stroke="#23211f" stroke-width="1.2" opacity="0.16"/>

          <image href="imgs/upper.png" x="58" y="18" width="204" height="86" preserveAspectRatio="xMidYMid meet" opacity="0.95"/>
          <image href="imgs/lower.png" x="54" y="110" width="212" height="86" preserveAspectRatio="xMidYMid meet" opacity="0.95"/>

          <path d="M108,74 C120,58 132,50 144,46" stroke="#5f825e" stroke-width="2" fill="none" stroke-linecap="round"/>
          <path d="M212,74 C200,58 188,50 176,46" stroke="#5f825e" stroke-width="2" fill="none" stroke-linecap="round"/>

          <path d="M106,72 C114,56 128,48 142,44 C126,54 116,62 106,72 Z" fill="#6f9a69" stroke="#23211f" stroke-width="1.6"/>
          <path d="M214,72 C206,56 192,48 178,44 C194,54 204,62 214,72 Z" fill="#6f9a69" stroke="#23211f" stroke-width="1.6"/>

          <g transform="translate(160,136)">
            <path d="M0,-6 C-16,-8 -24,-20 -16,-30 C-8,-40 0,-36 0,-24 C0,-36 8,-40 16,-30 C24,-20 16,-8 0,-6 Z" fill="#ff76a2" stroke="#23211f" stroke-width="2"/>
            <path d="M-10,4 L-18,30 L-2,22 Z" fill="#ff76a2" stroke="#23211f" stroke-width="1.8"/>
            <path d="M10,4 L18,30 L2,22 Z" fill="#ff76a2" stroke="#23211f" stroke-width="1.8"/>
            <circle cx="0" cy="-6" r="7" fill="#ff5c8d" stroke="#23211f" stroke-width="2"/>
          </g>
        </svg>
      </div>

      <div id="flowerArea"></div>

      <p class="empty-note" id="emptyNote">your bouquet starts here —<br>pick a flower to begin</p>

      <div id="letterTag">
        <div class="hole"></div>
        <div class="letter-text" id="letterText">Write something kind...</div>
        <div class="letter-sign" id="letterSign"></div>
      </div>
    </div>
  </div>

</div>

<script src="script.js"></script>
</body>
</html>
