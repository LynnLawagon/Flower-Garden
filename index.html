<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bloom & Note — Bouquet Builder</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;600;700&family=Quicksand:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>

<body>

<div class="title">
  <h1>Bloom &amp; Note</h1>
  <p>build a bouquet, tuck in a little letter</p>
</div>

<div class="container">

  <div class="controls">

    <div class="panel-label">🌿 pick your blooms</div>
    <div class="flower-grid" id="flowerGrid"></div>

    <div class="panel-label">🎀 wrapper style</div>
    <div class="wrap-row" id="wrapRow"></div>

    <div class="panel-label">🎨 wrapper color</div>
    <div class="color-row" id="colorRow"></div>

    <div class="panel-label">✉️ your note</div>
    <textarea id="letterInput" placeholder="Write something kind..." maxlength="240"></textarea>
    <input class="sign-input" id="signInput" placeholder="Sign it (optional)" maxlength="30">

    <button class="action-btn" id="saveBtn">Save as keepsake</button>
    <button class="action-btn ghost" id="clearBtn">Clear bouquet</button>

    <p class="hint">Drag a flower to arrange it. Tap the ✕ or double-click to remove it.</p>

  </div>

  <div class="stage-outer">
    <div id="stage">
      <span class="tape left"></span>
      <span class="tape right"></span>

      <!-- Bouquet Wrapper Graphics Layer -->
      <div id="bouquetWrapper">
        <svg viewBox="0 0 240 180" xmlns="http://www.w3.org/2000/svg">
          <!-- Main Wrapper Cone -->
          <path id="wrapperShape" d="M30,10 L210,10 C210,10 230,110 160,165 C135,185 105,185 80,165 C10,110 30,10 30,10 Z" 
                fill="#ffd1dc" stroke="#23211f" stroke-width="3"/>
          <!-- Ribbon Bow / Tie -->
          <g transform="translate(120, 140)">
            <path d="M0,0 C-25,-15 -35,15 0,25 C35,15 25,-15 0,0 Z" fill="#fff" stroke="#23211f" stroke-width="2.5"/>
            <path d="M0,0 C-25,-25 -50,-10 -35,10 C-20,30 -5,10 0,0 Z" fill="#fff" stroke="#23211f" stroke-width="2.5"/>
            <path d="M0,0 C25,-25 50,-10 35,10 C20,30 5,10 0,0 Z" fill="#fff" stroke="#23211f" stroke-width="2.5"/>
            <circle cx="0" cy="0" r="7" fill="#23211f"/>
          </g>
        </svg>
      </div>

      <div id="flowerArea"></div>

      <p class="empty-note" id="emptyNote">your bouquet starts here —<br>pick a flower to begin</p>

      <div id="letterTag">
        <div class="hole"></div>
        <div class="letter-text" id="letterText">Write something kind...</div>
        <div class="letter-sign" id="letterSign"></div>
      </div>
    </div>
  </div>

</div>

<script src="script.js"></script>
</body>
</html>
