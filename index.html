<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bloom & Note — Bouquet Builder</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;600;700&family=Quicksand:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>

<body>

<div class="title">
  <h1>Bloom &amp; Note</h1>
  <p>build a bouquet, tuck in a little letter</p>
</div>

<div class="container">

  <div class="controls">

    <div class="panel-label">🌿 pick your blooms</div>
    <div class="flower-grid" id="flowerGrid"></div>

    <div class="panel-label">🎀 background style</div>
    <div class="wrap-row" id="wrapRow"></div>

    <div class="panel-label">🎨 wrapper color</div>
    <div class="color-row" id="colorRow"></div>

    <div class="active-flower-panel" id="activeFlowerPanel">
      <div class="panel-label" style="font-size:18px; margin:0 0 6px 0; border:none;">✨ adjust selected bloom</div>
      <div class="control-row">
        <span>Rotate</span>
        <input type="range" id="sideRot" min="-180" max="180" value="0">
      </div>
      <div class="control-row">
        <span>Size</span>
        <input type="range" id="sideScale" min="0.6" max="1.6" step="0.05" value="1">
      </div>
    </div>

    <div class="panel-label">✉️ your note</div>
    <textarea id="letterInput" placeholder="Write something kind..." maxlength="240"></textarea>
    <input class="sign-input" id="signInput" placeholder="Sign it (optional)" maxlength="30">

    <button class="action-btn" id="saveBtn">Save as keepsake</button>
    <button class="action-btn ghost" id="clearBtn">Clear bouquet</button>

    <p class="hint">Click a flower to adjust. Drag to move. Press ✕ to delete.</p>

  </div>

  <div class="stage-outer">
    <div id="stage">
      <span class="tape left"></span>
      <span class="tape right"></span>

      <!-- Bouquet Wrapper Graphics Layer -->
      <div id="bouquetWrapper">
        <svg viewBox="0 0 300 240" xmlns="http://www.w3.org/2000/svg">
          <!-- Back wrapper folds -->
          <path d="M70,40 L150,15 L230,40 L260,110 L40,110 Z" fill="currentColor" stroke="#23211f" stroke-width="2.5" opacity="0.5"/>
          <path d="M50,25 L150,5 L250,25 L270,120 L30,120 Z" fill="currentColor" stroke="#23211f" stroke-width="2.5" opacity="0.75"/>
          
          <!-- Main Wrapper Cone -->
          <path id="wrapperShape" d="M60,60 L240,60 C240,60 270,180 180,215 C160,223 140,223 120,215 C30,180 60,60 60,60 Z" 
                fill="#ffea85" stroke="#23211f" stroke-width="3"/>
          <path d="M150,60 L150,215" stroke="#23211f" stroke-width="1.5" stroke-dasharray="4 4" opacity="0.4"/>
          
          <!-- Ribbon Bow / Tie -->
          <g transform="translate(150, 190)">
            <path d="M0,0 C-30,-15 -40,15 0,25 C40,15 30,-15 0,0 Z" fill="#ff76a2" stroke="#23211f" stroke-width="2.5"/>
            <path d="M0,0 C-30,-25 -65,-10 -45,15 C-25,30 -10,10 0,0 Z" fill="#ff8dae" stroke="#23211f" stroke-width="2.5"/>
            <path d="M0,0 C30,-25 65,-10 45,15 C25,30 10,10 0,0 Z" fill="#ff8dae" stroke="#23211f" stroke-width="2.5"/>
            <path d="M-15,20 L-25,55 L-5,45 Z" fill="#ff76a2" stroke="#23211f" stroke-width="2"/>
            <path d="M15,20 L25,55 L5,45 Z" fill="#ff76a2" stroke="#23211f" stroke-width="2"/>
            <circle cx="0" cy="0" r="8" fill="#ff5c8d" stroke="#23211f" stroke-width="2.5"/>
          </g>
        </svg>
      </div>

      <div id="flowerArea"></div>

      <p class="empty-note" id="emptyNote">your bouquet starts here —<br>pick a flower to begin</p>

      <div id="letterTag">
        <div class="hole"></div>
        <div class="letter-text" id="letterText">Write something kind...</div>
        <div class="letter-sign" id="letterSign"></div>
      </div>
    </div>
  </div>

</div>

<script src="script.js"></script>
</body>
</html>
